# Weekly and grouped, so it is a few pull requests. Security fixes do not wait for the week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The base images, which the CVE scan most often finds fixes in. See decisions/cve.md.
  - package-ecosystem: docker
    directories:
      - /cv-api
      - /cv-ui
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
    # A runtime's major version moves with the code's toolchain, by hand: java's with the gradle
    # toolchain, node's with cv-ui/.nvmrc.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /cv-api
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]
  # The ui's pnpm workspace: every app and package, from its one lockfile.
  - package-ecosystem: npm
    directory: /cv-ui
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
