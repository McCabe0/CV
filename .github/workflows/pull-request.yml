name: Pull request

# The checks a pull request needs. The images are built, not pushed, so a broken Dockerfile fails here.
# validate-ui joins in slice 2. See decisions/workflow.md.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-api:
    uses: ./.github/workflows/_validate-api.yml

  images:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cv-api
            context: cv-api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: GIT_SHA=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
