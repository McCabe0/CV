name: Pipeline

# Every push to main. Smoke, cve, perf, observability and the deploy test join slice by slice.
# See decisions/workflow.md.
on:
  push:
    branches:
      - main

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-api:
    uses: ./.github/workflows/_validate-api.yml

  images:
    name: image ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - image: cv-api
            context: cv-api
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
