name: Nightly

# The slow checks that rarely fail, kept off every push so the pipeline stays quick, on the newest full
# set of images each morning, or by hand: the CVE scan, as new vulnerabilities appear with no push, and
# ZAP's attack scan of the api, the k6 load test, and the deploy test of the helm charts. Keeps one
# issue open while any fails, closing it when all pass. See decisions/workflow.md, cve.md, zap.md,
# performance.md and deploy.md.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 50
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A commit a newer push replaced has no images, and a failed run can leave only some of the six.
      - name: Find the newest commit with a full set of images
        id: find
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          for commit in $(git log --format=%H); do
            missing=
            for service in api shell profile cv jobs admin; do
              docker manifest inspect "$registry/cv-$service:$commit" > /dev/null 2>&1 || missing=yes
            done
            if [[ -z $missing ]]; then
              echo "tag=$commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'No commit in the last 50 has a full set of images'
          exit 1

  cve:
    needs: newest
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_cve.yml
    with:
      tag: ${{ needs.newest.outputs.tag }}

  zap:
    needs: newest
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_zap.yml
    with:
      tag: ${{ needs.newest.outputs.tag }}

  perf:
    needs: newest
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_perf.yml
    with:
      tag: ${{ needs.newest.outputs.tag }}

  deploy-test:
    needs: newest
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy-test.yml
    with:
      tag: ${{ needs.newest.outputs.tag }}

  report:
    needs: [newest, cve, zap, perf, deploy-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEWEST: ${{ needs.newest.result }}
          CVE: ${{ needs.cve.result }}
          ZAP: ${{ needs.zap.result }}
          PERF: ${{ needs.perf.result }}
          DEPLOY: ${{ needs.deploy-test.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly checks failed'
          results="finding the images: $NEWEST, cve: $CVE, zap: $ZAP, perf: $PERF, deploy test: $DEPLOY"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ $NEWEST == success && $CVE == success && $ZAP == success && $PERF == success && $DEPLOY == success ]]; then
            if [[ -n $issue ]]; then gh issue close "$issue" --comment "Passing again: $RUN"; fi
          elif [[ -n $issue ]]; then
            gh issue comment "$issue" --body "Still failing ($results): $RUN"
          else
            gh issue create --title "$title" --body "$results. See the reports: $RUN"
          fi
