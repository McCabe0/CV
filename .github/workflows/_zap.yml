name: ZAP scan

# OWASP ZAP, all three scans, nightly: the passive scans of the ui signed in as a candidate and as an
# admin, and the attack scan of the api from its openapi docs. On a stack of its own, from a commit's
# pushed images (.github/actions/stack), as its attacks change data. Any warning not accepted, with its
# reason, in ci/zap fails it. The ui scans also run on every push, after the smoke tests. See
# decisions/zap.md.
on:
  workflow_call:
    inputs:
      tag:
        description: The images' tag, a commit hash.
        required: true
        type: string

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: cv-ui

    steps:
      # The commit the images were built from, so the scan's rules and sign in match them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: cv-ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cv-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: cv-ui/pnpm-lock.yaml
      # Playwright signs in, for the session cookies the ui scans send.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/stack
        with:
          tag: ${{ inputs.tag }}
      - name: Scan
        working-directory: .
        run: ./ci/zap.sh
        timeout-minutes: 20
      - name: Show the stack's logs
        if: ${{ failure() }}
        working-directory: .
        run: docker compose logs --no-color
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: ci/zap-report/
          retention-days: 7
