name: Smoke tests

# The whole stack together, from the commit's pushed images (.github/actions/stack): the ui, the api, the
# cv-worker (its LLM wiremock playing gemini), the job-worker (crawling wiremock playing the job
# boards), postgres, kafka and keycloak with the api's test realm. Playwright signs in and uses the ui
# as a person would. Then OWASP ZAP's passive scans of the ui, signed in as a candidate and as an admin,
# which only read what the pages send. ZAP's attacks on the api run nightly, on a stack of their own
# (_zap.yml). See decisions/workflow.md and decisions/zap.md.
on:
  workflow_call:
    inputs:
      tag:
        description: The images' tag, a commit hash. This run's commit if left out.
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: cv-ui

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: cv-ui/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: cv-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: cv-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/stack
        with:
          tag: ${{ inputs.tag || github.sha }}
      - run: pnpm e2e
        timeout-minutes: 10
      - name: Scan the ui with ZAP
        working-directory: .
        run: ./ci/zap.sh candidate admin
        timeout-minutes: 10
      - name: Show the stack's logs
        if: ${{ failure() }}
        working-directory: .
        run: docker compose logs --no-color
      - name: Upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: smoke-report
          path: cv-ui/playwright-report/
      - name: Upload the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: zap-ui-report
          path: ci/zap-report/
          retention-days: 7
          if-no-files-found: ignore
