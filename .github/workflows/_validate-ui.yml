name: Validate UI

# pnpm check: prettier, eslint, typecheck, and jest with the 90% coverage gate in every app and
# package. See decisions/workflow.md.
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-ui

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: cv-ui/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: cv-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: cv-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ui-coverage
          path: |
            cv-ui/apps/*/coverage/
            cv-ui/packages/*/coverage/
