name: Image

# Builds one image and pushes it to ghcr, tagged with the commit. Layers are cached in github actions.
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      build-args:
        required: false
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names are lowercase, and the owner (McCabe0) is not.
      - name: Name the image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "REGISTRY=ghcr.io/${OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ inputs.build-args }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
