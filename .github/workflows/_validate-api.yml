name: Validate API

# ./gradlew check: ktlint, unit and integration tests (testcontainers), and the 90% coverage gate in
# every module. See decisions/workflow.md.
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-api

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - run: ./gradlew check --no-daemon
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: api-coverage
          path: cv-api/*/build/reports/jacoco/test/
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: api-test-reports
          path: cv-api/*/build/reports/tests/
