# One gateway, as a cloud's load balancer would be. The service's routes are on port 80, where the test
# reaches it as compose's 3000. Keycloak has a listener of its own, as it has its own port in compose and
# its own host in production, and only its route is on it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: keycloak
      protocol: HTTP
      port: 8180
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain secrets, where a cloud's would come from its secret store.
apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: {{ .Values.appNamespace }}
stringData:
  username: {{ .Values.database.username }}
  password: {{ .Values.database.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ui
  namespace: {{ .Values.appNamespace }}
stringData:
  client-secret: {{ .Values.ui.clientSecret }}
  session-secret: {{ .Values.ui.sessionSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm
  namespace: {{ .Values.appNamespace }}
stringData:
  gemini-api-key: {{ .Values.llm.geminiApiKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.database.name }}}
            - {name: POSTGRES_USER, value: {{ .Values.database.username }}}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.database.password }}}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.database.username }}, -d, {{ .Values.database.name }}]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
# Only the api's three roles reach postgres and kafka. Run.sh checks that another pod cannot.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [api, cv-worker, job-worker]}
      ports:
        - port: 5432
---
# Kraft mode, one node, as compose's. Its address is the service's, so clients in other namespaces find
# it. The api declares its topics, so a typo cannot make a new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # Kubernetes would otherwise give it KAFKA_PORT and the like, for the service called kafka, which
      # the image reads as settings.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka.{{ .Release.Namespace }}:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_NUM_PARTITIONS, value: "6"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx256m -Xms256m"}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels: {app: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [api, cv-worker, job-worker]}
      ports:
        - port: 9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  realm-export.json: |-
{{ required "files.realm" .Values.files.realm | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {app: keycloak}
spec:
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak }}
          args: [start-dev, --import-realm]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
            - {name: KC_HOSTNAME, value: {{ .Values.keycloakHostname | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 512Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
    - name: public
      sectionName: keycloak
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
{{- /* Wiremock playing gemini and the job boards, from the mappings the e2e stack uses. */}}
{{- range $name := list "gemini" "boards" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app: {{ $name }}}
spec:
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      containers:
        - name: wiremock
          image: {{ $.Values.images.wiremock }}
          env:
            - {name: JAVA_OPTS, value: "-Xmx128m"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /__admin/health, port: 8080}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 25m, memory: 192Mi}
          volumeMounts:
            - {name: mappings, mountPath: /home/wiremock/mappings}
      volumes:
        - name: mappings
          configMap: {name: {{ $name }}-mappings}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports:
    - port: 8080
{{- end }}
