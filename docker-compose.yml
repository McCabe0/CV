# Local Postgres for developing against the production code path.
# Start: docker compose up -d
# Then run the backend with the `prod` profile (see docs/accounts-and-db-plan.md):
#   SPRING_PROFILES_ACTIVE=prod \
#   DATABASE_URL=jdbc:postgresql://localhost:5432/skill2career \
#   DATABASE_USER=skill2career DATABASE_PASSWORD=localdev \
#   ./gradlew bootRun
services:
  postgres:
    image: postgres:16
    container_name: skill2career-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill2career
      POSTGRES_USER: skill2career
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - skill2career-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill2career -d skill2career"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skill2career-pgdata:
