# Local secrets (gitignored). Optional so CI / tests / fresh clones start without it.
# Covers running from the backend dir (gradlew) or the repo root (some IDE run configs).
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

gemini.api.key=${GEMINI_API_KEY:}

# --- Default (dev) datasource: in-memory H2 ---
# Production uses the `prod` profile (application-prod.properties) with Postgres + Flyway.
spring.datasource.url=jdbc:h2:mem:skill2career;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flyway is the schema authority in prod only; H2 dev relies on ddl-auto above.
spring.flyway.enabled=false
