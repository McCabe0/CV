# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# Requires DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD env vars (see docs/accounts-and-db-plan.md).

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
